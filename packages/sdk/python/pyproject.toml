[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omochi-ui"
version = "0.1.0"
description = "Declarative, transport-independent application runtime for A2UI"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
websocket = ["websockets>=14"]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/omochi_ui"]

[project.urls]
Repository = "https://github.com/k-kozika/omochi"
Documentation = "https://github.com/k-kozika/omochi/blob/main/docs/sdk.md"
Issues = "https://github.com/k-kozika/omochi/issues"
